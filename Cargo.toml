[package]
name = "vess-bench"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
anyhow = "=1.0.104"
bincode = "=1.3.3"
clap = { version = "=4.6.1", features = ["derive"] }
curve25519-dalek = { version = "=4.1.3", features = ["serde", "digest", "rand_core"] }
rand = "=0.8.5"
rand_chacha = "=0.3.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
sha3 = "=0.10.9"
hex = "0.4.3"
toml = "=0.8.23"
zeroize = { version = "=1.8.2", features = ["derive"] }
rustls = { version = "=0.23.40", default-features = false, features = ["std", "ring", "tls12"] }
rcgen = { version = "=0.14.9", default-features = false, features = ["crypto", "ring"] }
c-kzg = "=2.1.7"
ark-bn254 = "=0.4.0"
ark-ec = "=0.4.2"
ark-ff = "=0.4.2"
num-bigint = "=0.4.8"
num-traits = "=0.2.19"
k256 = "=0.13.4"
libc = "=0.2.189"
halo2curves = { version = "=0.10.0", features = ["derive_serde"] }

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1

